# /etc/nginx/sites-available/avsinsotech.conf  (Linux deployment)
# TLS certificates via:  sudo certbot --nginx -d avsinsotech.com -d www.avsinsotech.com -d api.avsinsotech.com

server {
    listen 80;
    server_name avsinsotech.com www.avsinsotech.com api.avsinsotech.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name avsinsotech.com;
    # ssl_certificate / ssl_certificate_key managed by certbot
    return 301 https://www.avsinsotech.com$request_uri;
}

# ---------- Website (Next.js on :3000) ----------
server {
    listen 443 ssl http2;
    server_name www.avsinsotech.com;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- API (ASP.NET Core on :5080) ----------
server {
    listen 443 ssl http2;
    server_name api.avsinsotech.com;
    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
